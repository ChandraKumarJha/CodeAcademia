<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor + Tailwind (Absolute Offline Setup)</title>
    
    <!-- 1. LOCAL TAILWIND: Compiles successfully from your local output routing -->
    <link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navbar Container -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚡</span>
            <h1 class="text-xl font-bold tracking-tight bg-linear-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
                Offline Local IDE
            </h1>
        </div>
        <div class="flex items-center space-x-4">
            <select id="languageSelect" class="bg-slate-700 border border-slate-600 rounded px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                <option value="javascript">JavaScript</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="json">JSON</option>
            </select>
            <button id="runBtn" class="bg-sky-500 hover:bg-sky-600 active:scale-95 transition-all text-white font-medium text-sm px-4 py-1.5 rounded shadow">
                Run Code
            </button>
        </div>
    </header>

    <!-- Main Dynamic Layout Container -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 p-6 overflow-hidden">
        <!-- Left Column: Monaco Editor Area -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 flex flex-col shadow-inner">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Source Editor</span>
            </div>
            <!-- Monaco Container -->
            <div id="editorContainer" class="flex-1 w-full min-h-[400px] rounded-lg overflow-hidden border border-slate-700"></div>
        </div>

        <!-- Right Column: Output / Console Area -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 flex flex-col shadow-inner">
            <div class="flex items-center mb-3">
                <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Console Output</span>
            </div>
            <div id="outputConsole" class="flex-1 w-full bg-slate-950 rounded-lg p-4 font-mono text-sm text-green-400 overflow-y-auto whitespace-pre-wrap border border-slate-900">
🔄 Loading offline modules...
            </div>
        </div>
    </main>

    <!-- 2. FIX: Explicitly point script to the target loader file. Removed type="module" -->
    <script src="./vs/loader.js"></script>
    
    <!-- 3. FIX: Removed type="module" here so require can be verified globally -->
    <script>
        let editor;

        // Verify if loader initialization worked flawlessly
        if (typeof require === 'undefined') {
            document.getElementById('outputConsole').innerText = "❌ Script Error: 'loader.js' could not expose the global require function. Please check that the 'vs' directory sits in the same directory path folder as this HTML file.";
        } else {
            // Configure require map layout settings
            require.config({ 
                paths: { 'vs': './vs' } 
            });

            // Load the editor code modules safely
            require(['vs/editor/editor.main'], function() {
                
                const initialCode = `// Running 100% Offline with Zero Network Dependencies!\nfunction hello() {\n    console.log("Success! Local packages loaded cleanly.");\n}\n\nhello();`;

                editor = monaco.editor.create(document.getElementById('editorContainer'), {
                    value: initialCode,
                    language: 'javascript',
                    theme: 'vs-dark',
                    fontSize: 14,
                    fontFamily: "Fira Code, Menlo, Monaco, 'Courier New', monospace",
                    minimap: { enabled: true },
                    automaticLayout: true,
                    padding: { top: 12, bottom: 12 }
                });
                
                document.getElementById('outputConsole').innerText = 'Your output will be shown here -->';
            });
        }

        // Handle language switching dynamically
        document.getElementById('languageSelect').addEventListener('change', (e) => {
            if (editor) {
                const model = editor.getModel();
                monaco.editor.setModelLanguage(model, e.target.value);
            }
        });

        // Wire up the Run Code engine workflow 
        document.getElementById('runBtn').addEventListener('click', () => {
            if (!editor) return;
            const currentCode = editor.getValue();
            const consoleBox = document.getElementById('outputConsole');
            consoleBox.innerText = "\n";
            try {
                let logOutput = "";
                const originalLog = console.log;
                console.log = function(...args) { logOutput += args.join(' ') + '\n'; };
                new Function(currentCode)();
                console.log = originalLog;
                consoleBox.innerText += logOutput || "Code executed with no output.";
            } catch (err) {
                consoleBox.innerText += `❌ Runtime Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
