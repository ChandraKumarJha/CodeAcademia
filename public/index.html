<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/output.css">
    <title>Code Academia</title>
    <link rel="shortcut icon" href="/images/logo.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/6e037d5a8d.js" crossorigin="anonymous"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || 
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
            .sun-logo {
          stroke: currentColor;
          fill: currentColor;
          transition: transform 0.3s ease;
        }
        @media (prefers-color-scheme: dark) {
          .sun-logo {
            color: #ffffff !important;
          }
        }

        @media (prefers-color-scheme: light) {
          .sun-logo {
            color: #1a1a1a !important;
          }
        }
        [data-theme="dark"] .sun-logo {
          color: #ffffff !important;
        }

        [data-theme="light"] .sun-logo {
          color: #1a1a1a !important;
        }
        .menu {
            display: fixed;
            border: none;
            width: 20px;
            height: 2px;
            background-color: black;
        }
        .dark .menu {
            background-color: #f1f5f9;
            height: 1px;
            margin-bottom: 1.25rem;
        }

    </style>
</head>
<body class="bg-slate-100 dark:text-slate-100 flex items-center justify-center h-screen dark:bg-slate-950 transition-colors duration-300 ease-in ">
    <!-- main navigation bar -->
    <nav class="fixed top-5 flex flex-row">
        

        <button id="menu" class="fixed left-5 top-8 md:hidden">
            <hr class="w-5 h-px mb-1.75 bg-black border-none dark:bg-slate-100">
            <hr class="w-5 h-px mb-1.75 bg-black border-none dark:bg-slate-100">
            <hr class="w-5 h-px mb-1.75 bg-black border-none dark:bg-slate-100">
        </button>
        <div id="sidebar" class="fixed top-20 left-8 w-4/5 h-52 rounded-xl border border-gray-500 hidden">
            <a href="/courses" class="w-full flex items-center h-1/4 pl-5 text-lg">Courses</a>            
            <a href="/about" class="w-full flex items-center h-1/4 pl-5 text-lg">About</a>
            <a href="/practice" class="w-full flex items-center h-1/4 pl-5 text-lg">Practice</a>
            <a href="/signup" class="w-full flex items-center h-1/4">
                <div class="h-3/4 w-full bg-slate-950 dark:bg-slate-400 rounded-lg m-3 flex justify-center 
                items-center text-slate-100 dark:text-slate-800">Get Started</div>
            </a>
        </div>

        <!-- logo -->
        <a href="/">
            <img src="images/logo.png" alt="logo" class="h-9 md:h-12 rounded-xl fixed left-14 md:left-12">
            <div class="fixed left-28 md:left-32 top-6 md:top-7 text-2xl font-semibold">Code Academia</div>
        </a>

        <ul class="md:flex md:flex-row hidden relative">
            <div class="absolute -left-32 flex gap-52" id="courses">
                <a href="/courses" class="mt-2 ml-3 text-xl font-semibold px-4 py-1 
                flex flex-col justify-center items-center hover:text-blue-600 text-center group absolute">
                    Courses 
                    <div class="mt-4 h-1 w-5 rounded-full group-hover:bg-sky-400 group-hover:h-1.25
                    group-hover:w-full transition-all duration-200"></div>
                </a>
                <div id="coursesBox" class="text-lg font-medium absolute top-20 flex gap-5"></div>
            </div>
            <a href="/about" class="h-10 text-xl font-semibold px-4 flex flex-col justify-between items-center group">
                <span class="group-hover:text-blue-600">About</span>
                <div class="h-1.25 w-2 rounded-full bg-transparent transition-all duration-200 group-hover:bg-sky-400 group-hover:w-full"></div>
            </a>
            <div class="w-32 h-12  flex flex-col justify-center items-center mt-3" id="practice">
                <a href="/practice" class="mt-2 ml-3 text-xl font-semibold px-4 py-1 
                flex flex-col justify-center items-center hover:text-blue-600 text-center group">
                    Practice 
                    <div class="mt-4 h-1 w-5 rounded-full group-hover:bg-sky-400 group-hover:h-1.25
                    group-hover:w-full transition-all duration-200"></div>
                </a>
                <div id="practiceBox" class="mt-6 text-lg font-medium"></div>
            </div>
        </ul>
        <button id="theme-toggle" class="mt-2 text-black fixed right-6 md:right-52 p-2 rounded-xl 
        dark:text-slate-300 bg-slate-200 dark:bg-slate-800 font-medium cursor-pointer 
        hover:bg-slate-300 dark:hover:bg-slate-900 flex items-center justify-center">
            <svg width="16" height="16" viewBox="0 0 12 12" xmlns="http://w3.org" class="sun-icon">
              <!-- Hollow Central Circle (Thick 1px stroke, hollow center) -->
                <circle cx="6" cy="6" r="1.5" stroke="currentColor" stroke-width="1" fill="none" />

              <!-- 8 Short, Thick Rays (Shortened length to match the image) -->
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(45 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(90 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(135 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(180 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(225 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(270 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(315 6 6)" />
            </svg>

        </button>
        

        <a href="/signin" class="bg-linear-to-r from-indigo-500 to-purple-500 px-4 py-2 h-11 
        rounded-xl text-slate-50 font-medium hidden md:flex fixed md:right-12">Get Started</a>

    </nav>

    <main class="h-full flex justify-center items-center flex-col gap-4">
        <h1 class="text-3xl p-4 text-center  font-semibold md:text-5xl">
            Learn Full Stack Web Development 
        </h1>
        <h2 class="font-merriweather p-4 text-center -mt-8 font-normal text-3xl md:text-5xl">
            with Code Academia
        </h2>
        <p class="text-center text-lg opacity-50 px-3">
            Code Academia teaches Full Stack Web Development including languages like HTML, CSS, JavaScript, Node.js, and Databases...
        </p>
        <a href="/web-dev" class="bg-linear-to-r from-sky-600 via-indigo-500 to-violet-600 
        px-4 py-2 rounded-xl text-slate-50 font-semibold hover:">Web Dev Courses</a>
    </main>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        
        toggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
    <script src="/js/index.js"></script>
</body>
</html>
