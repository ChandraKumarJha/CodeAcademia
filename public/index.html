<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/output.css">
    <title>Code Academia</title>
    <link rel="shortcut icon" href="/images/logo.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/6e037d5a8d.js" crossorigin="anonymous"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || 
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
            .sun-logo {
          stroke: currentColor;
          fill: currentColor;
          transition: transform 0.3s ease;
        }
        @media (prefers-color-scheme: dark) {
          .sun-logo {
            color: #ffffff !important;
          }
        }

        @media (prefers-color-scheme: light) {
          .sun-logo {
            color: #1a1a1a !important;
          }
        }
        [data-theme="dark"] .sun-logo {
          color: #ffffff !important;
        }

        [data-theme="light"] .sun-logo {
          color: #1a1a1a !important;
        }
        .menu {
            display: fixed;
            right: -20px;
            width: 15px;
            height: 4px;
            color: black;
        }

    </style>
</head>
<body class="bg-slate-100 dark:text-slate-100 flex items-center justify-center h-screen dark:bg-slate-950 transition-colors duration-300 ease-in ">
    <!-- main navigation bar -->
    <nav class="fixed top-5 flex flex-row">
        
        <button id="menu" class="fixed -left-20 md:hidden">
            <hr class="menu">
            <hr class="menu">
            <hr class="menu">
        </button>

        <!-- logo -->
        <a href="/">
            <img src="images/logo.png" alt="logo" class="h-12 rounded-xl fixed left-12">
            <div class="fixed left-32 top-7 text-2xl font-semibold">Code Academia</div>
        </a>

        <ul class="flex flex-row">
            <div class="w-44" id="courses">
                <a href="/siginin" class="mt-2 ml-3 text-xl font-semibold px-4 py-1 hover:bg-slate-200 rounded-full transition-colors duration-150 ease-in">Courses <sup>&#x2304;</sup></a>
                <div id="coursesBox" class="mt-6 text-lg font-medium"></div>
            </div>
            <a href="/about" class="-mt-1 h-10 text-xl font-semibold px-4 flex justify-center items-center hover:bg-slate-200 rounded-full transition-colors duration-150 ease-in">About</a>
            <div class="w-44 ml-16" id="practice">
                <a href="/siginin" class="mt-2  text-xl font-semibold px-4 py-1 hover:bg-slate-200 rounded-full transition-colors duration-150 ease-in">Practice <sup>&#x2304;</sup></a>
                <div id="practiceBox" class="mt-6 text-lg font-medium"></div>
            </div>
        </ul>
        <button id="theme-toggle" class="mt-2 text-black fixed right-12 p-2 rounded-xl dark:text-slate-300 bg-slate-200 dark:bg-slate-800 font-medium cursor-pointer 
        hover:bg-slate-300 dark:hover:bg-slate-900 flex items-center justify-center">
            <svg width="16" height="16" viewBox="0 0 12 12" xmlns="http://w3.org" class="sun-icon">
              <!-- Hollow Central Circle (Thick 1px stroke, hollow center) -->
                <circle cx="6" cy="6" r="1.5" stroke="currentColor" stroke-width="1" fill="none" />

              <!-- 8 Short, Thick Rays (Shortened length to match the image) -->
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(45 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(90 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(135 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(180 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(225 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(270 6 6)" />
                <line x1="6" y1="2.2" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" transform="rotate(315 6 6)" />
            </svg>

            
        </button>
        

    </nav>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        
        toggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
    <script src="/js/index.js"></script>
</body>
</html>
